# analysis_options.yaml (en la raíz del proyecto, al lado de pubspec.yaml)
# Reglas recomendadas para Flutter (flutter create ya lo deja escrito)
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    # Reglas extra que conviene activar
    prefer_const_constructors: true
    prefer_single_quotes: true
    directives_ordering: true
    always_declare_return_types: true
    # Así se apaga una regla del paquete:
    # avoid_print: false
# Opcional (Dart 3.7 o posterior): ancho máximo de línea para dart format
formatter:
  page_width: 80
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
